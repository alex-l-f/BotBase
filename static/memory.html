<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotBase — Memory Browser</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-muted: #666;
    --accent: #0066cc;
    --danger: #b42318;
    --user-chip: #e6eef8;
    --user-chip-text: #1f3f6b;
    --assistant-chip: #e8e8e8;
    --assistant-chip-text: #333;
    --event-chip: #f0e8f8;
    --event-chip-text: #4a3568;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
  }

  header {
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  header h1 { font-size: 16px; font-weight: 600; }

  #stats {
    font-size: 12px;
    color: var(--text-muted);
  }

  header a.header-link {
    margin-left: auto;
    font-size: 13px;
    color: var(--accent);
    text-decoration: none;
  }
  header a.header-link:hover { text-decoration: underline; }

  main {
    max-width: 1060px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .card h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card h2 .spacer { margin-left: auto; }

  #auth-banner {
    display: none;
    background: #fdecea;
    border: 1px solid #f5c6c0;
    color: var(--danger);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
  }
  #auth-banner a { color: var(--danger); font-weight: 600; }

  #snapshot-block {
    font-family: "SF Mono", "Consolas", "Menlo", monospace;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    background: #faf8f5;
    border: 1px dashed #d4c9a8;
    color: #5a5040;
    border-radius: 8px;
    padding: 10px 12px;
    max-height: 260px;
    overflow-y: auto;
  }

  #snapshot-block.empty { font-style: italic; color: var(--text-muted); border-style: solid; }

  .btn {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    font-size: 12px;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); color: #fff; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filters input, .filters select, .add-form input, .add-form select, .add-form textarea, td.editing input, td.editing select, textarea.edit-content {
    padding: 6px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
  }
  .filters input:focus, .add-form input:focus, .add-form textarea:focus, textarea.edit-content:focus { outline: none; border-color: var(--accent); }

  #f-query { flex: 1; min-width: 180px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }

  td.col-content { width: 55%; white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
  td.col-when, td.col-session { white-space: nowrap; color: var(--text-muted); font-size: 12px; }
  td.col-actions { white-space: nowrap; text-align: right; }
  td.col-actions .btn { padding: 3px 8px; }

  .kind-chip {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .kind-user { background: var(--user-chip); color: var(--user-chip-text); }
  .kind-assistant { background: var(--assistant-chip); color: var(--assistant-chip-text); }
  .kind-event { background: var(--event-chip); color: var(--event-chip-text); }

  .mode-tag { font-size: 12px; color: var(--text-muted); }

  textarea.edit-content { width: 100%; min-height: 70px; resize: vertical; }
  .edit-row-controls { display: flex; gap: 6px; margin-top: 6px; align-items: center; flex-wrap: wrap; }

  .pager {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: flex-end;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .add-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
  .add-form textarea { flex: 1 1 100%; min-height: 54px; resize: vertical; }

  .empty-note { color: var(--text-muted); font-size: 13px; padding: 14px 0; text-align: center; }

  #toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    color: #fff;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 8px;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  #toast.show { opacity: 0.92; }
</style>
</head>
<body>

<header>
  <h1>🧠 Memory Browser</h1>
  <span id="stats">loading…</span>
  <a class="header-link" id="back-link" href="#">← Back to chat</a>
</header>

<main>
  <div id="auth-banner">
    Not authenticated — <a id="login-link" href="#">log in on the chat page</a> first, then reload this tab.
  </div>

  <div class="card">
    <h2>Injected snapshot
      <span class="spacer"></span>
      <button class="btn" onclick="loadSnapshot()">↻ Refresh</button>
    </h2>
    <div id="snapshot-block" class="empty">loading…</div>
  </div>

  <div class="card">
    <h2>Scenarios
      <span class="spacer"></span>
      <button class="btn" onclick="loadScenarios()">↻ Refresh</button>
    </h2>
    <div class="add-form" style="margin-bottom:10px">
      <input id="sc-name" placeholder="scenario name, e.g. day-after-followup" style="flex:1;min-width:180px">
      <input id="sc-desc" placeholder="description (optional)" style="flex:2;min-width:220px">
      <button class="btn primary" onclick="saveScenario()" title="Snapshot the entire current memory log under this name">💾 Save current memory</button>
    </div>
    <div class="filters" style="margin-bottom:6px">
      <label style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="sc-retime" checked>
        On load, re-date entries so the newest is
      </label>
      <input id="sc-days" type="number" value="1" min="0" step="0.5" style="width:64px">
      <span style="font-size:12px;color:var(--text-muted)">day(s) ago (relative spacing preserved)</span>
    </div>
    <div id="scenario-list"></div>
  </div>

  <div class="card">
    <h2>Add a memory
      <span class="spacer"></span>
    </h2>
    <div class="add-form">
      <textarea id="add-content" placeholder="What should the bot remember? e.g. &quot;Let's try tactical breathing: in for 4, hold for 4…&quot; (written from the speaker's perspective)"></textarea>
      <select id="add-kind" title="Who said it — or 'event' for things like mode switches">
        <option value="user">user</option>
        <option value="assistant" selected>assistant</option>
        <option value="event">event</option>
      </select>
      <input id="add-mode" list="mode-list" placeholder="mode (e.g. coping_stress)" title="Topic mode the entry belongs to">
      <input id="add-session" value="manual-demo" title="Session id to file it under — keep the default for staged demo entries">
      <button class="btn primary" onclick="addEpisode()">+ Add</button>
    </div>
  </div>

  <div class="card">
    <h2>Episodic log
      <span class="spacer"></span>
      <button class="btn" onclick="load(0)">↻ Refresh</button>
    </h2>
    <div class="filters">
      <input id="f-query" placeholder="Search content…">
      <select id="f-kind">
        <option value="">any kind</option>
        <option value="user">user</option>
        <option value="assistant">assistant</option>
        <option value="event">event</option>
      </select>
      <select id="f-mode"><option value="">any mode</option></select>
      <input id="f-chat" placeholder="session id prefix" size="12">
      <button class="btn" onclick="load(0)">Filter</button>
      <button class="btn" onclick="clearFilters()">Clear</button>
    </div>
    <div id="table-wrap" style="margin-top:10px"></div>
    <div class="pager">
      <span id="pager-info"></span>
      <button class="btn" id="pg-prev" onclick="page(-1)">← Prev</button>
      <button class="btn" id="pg-next" onclick="page(1)">Next →</button>
    </div>
  </div>
</main>

<datalist id="mode-list"></datalist>
<div id="toast"></div>

<script>
// This page is served at <mount>/memory, so the app's base is the current
// path minus that one segment — works at the server root and behind a
// path-prefixed reverse proxy alike.
const API = window.location.origin +
  window.location.pathname.replace(/\/+$/, '').replace(/\/memory$/, '');

document.getElementById('back-link').href = API + '/';
document.getElementById('login-link').href = API + '/';

const LIMIT = 30;
let offset = 0;
let total = 0;
let editingId = null;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(path, opts = {}) {
  if (opts.body !== undefined) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(opts.body);
  }
  const resp = await fetch(API + path, opts);
  if (resp.status === 401) {
    document.getElementById('auth-banner').style.display = 'block';
    throw new Error('Not authenticated');
  }
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
  return data;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ----------------------------------------------------------------- loaders

async function loadStats() {
  try {
    const s = await api('/api/memory/stats');
    document.getElementById('stats').textContent =
      `${s.episodes} entries · ${s.sessions} sessions · last write ${s.last_write ? s.last_write.replace('T', ' ') : '—'}`;
    const opts = s.modes.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
    document.getElementById('f-mode').innerHTML = '<option value="">any mode</option>' + opts;
    document.getElementById('mode-list').innerHTML = opts;
  } catch (e) { /* auth banner already shown */ }
}

async function loadSnapshot() {
  const el = document.getElementById('snapshot-block');
  try {
    const data = await api('/api/memory/snapshot');
    if (data.block && data.block.trim()) {
      el.textContent = data.block.trim();
      el.classList.remove('empty');
    } else {
      el.textContent = 'Empty — no prior sessions yet, so nothing is injected. ' +
        'This block is prepended to the coach’s system prompt at the start of every multi-agent turn.';
      el.classList.add('empty');
    }
  } catch (e) { el.textContent = 'Could not load snapshot.'; }
}

async function load(newOffset) {
  if (newOffset !== undefined) offset = newOffset;
  editingId = null;
  const params = new URLSearchParams({ limit: LIMIT, offset });
  const q = document.getElementById('f-query').value.trim();
  const kind = document.getElementById('f-kind').value;
  const mode = document.getElementById('f-mode').value;
  const chat = document.getElementById('f-chat').value.trim();
  if (q) params.set('query', q);
  if (kind) params.set('kind', kind);
  if (mode) params.set('mode', mode);
  if (chat) params.set('chat', chat);
  try {
    const data = await api('/api/memory/episodes?' + params);
    total = data.total;
    renderTable(data.episodes);
  } catch (e) {
    document.getElementById('table-wrap').innerHTML =
      `<div class="empty-note">${esc(e.message)}</div>`;
  }
}

function clearFilters() {
  for (const id of ['f-query', 'f-chat']) document.getElementById(id).value = '';
  for (const id of ['f-kind', 'f-mode']) document.getElementById(id).value = '';
  load(0);
}

function page(dir) {
  const next = offset + dir * LIMIT;
  if (next < 0 || next >= total) return;
  load(next);
}

// ---------------------------------------------------------------- rendering

function renderTable(rows) {
  const wrap = document.getElementById('table-wrap');
  if (!rows.length) {
    wrap.innerHTML = '<div class="empty-note">No memory entries match.</div>';
  } else {
    wrap.innerHTML = `<table><thead><tr>
      <th>When</th><th>Session</th><th>Mode</th><th>Kind</th><th>Content</th><th></th>
    </tr></thead><tbody>
    ${rows.map(r => `<tr data-id="${r.id}">
      <td class="col-when">${esc((r.ts || '').replace('T', ' '))}</td>
      <td class="col-session" title="${esc(r.chat_id)}">${esc((r.chat_id || '').slice(0, 8))}</td>
      <td class="col-mode"><span class="mode-tag">${esc(r.mode || '—')}</span></td>
      <td class="col-kind"><span class="kind-chip kind-${esc(r.kind)}">${esc(r.kind)}</span></td>
      <td class="col-content">${esc(r.content)}</td>
      <td class="col-actions">
        <button class="btn" onclick='startEdit(${r.id}, ${JSON.stringify(r.content)}, ${JSON.stringify(r.mode || '')}, ${JSON.stringify(r.kind)})'>Edit</button>
        <button class="btn danger" onclick="removeEpisode(${r.id})">Delete</button>
      </td>
    </tr>`).join('')}</tbody></table>`;
  }
  const start = total ? offset + 1 : 0;
  const end = Math.min(offset + LIMIT, total);
  document.getElementById('pager-info').textContent = `${start}–${end} of ${total}`;
  document.getElementById('pg-prev').disabled = offset <= 0;
  document.getElementById('pg-next').disabled = offset + LIMIT >= total;
}

// ------------------------------------------------------------------ editing

function startEdit(id, content, mode, kind) {
  if (editingId !== null) load();  // collapse any other open editor
  editingId = id;
  const row = document.querySelector(`tr[data-id="${id}"]`);
  const cell = row.querySelector('.col-content');
  cell.innerHTML = `
    <textarea class="edit-content" id="edit-content-${id}"></textarea>
    <div class="edit-row-controls">
      <select id="edit-kind-${id}">
        ${['user', 'assistant', 'event'].map(k =>
          `<option value="${k}"${k === kind ? ' selected' : ''}>${k}</option>`).join('')}
      </select>
      <input id="edit-mode-${id}" list="mode-list" placeholder="mode" value="${esc(mode)}" size="18">
      <button class="btn primary" onclick="saveEdit(${id})">Save</button>
      <button class="btn" onclick="load()">Cancel</button>
    </div>`;
  document.getElementById(`edit-content-${id}`).value = content;
  row.querySelector('.col-actions').innerHTML = '';
}

async function saveEdit(id) {
  try {
    await api('/api/memory/episodes/' + id, { method: 'PUT', body: {
      content: document.getElementById(`edit-content-${id}`).value,
      kind: document.getElementById(`edit-kind-${id}`).value,
      mode: document.getElementById(`edit-mode-${id}`).value.trim(),
    }});
    toast('Saved');
    await Promise.all([load(), loadSnapshot(), loadStats()]);
  } catch (e) { toast('Save failed: ' + e.message); }
}

async function removeEpisode(id) {
  if (!confirm('Delete this memory entry? The bot will no longer be able to recall it.')) return;
  try {
    await api('/api/memory/episodes/' + id, { method: 'DELETE' });
    toast('Deleted');
    await Promise.all([load(), loadSnapshot(), loadStats()]);
  } catch (e) { toast('Delete failed: ' + e.message); }
}

async function addEpisode() {
  const content = document.getElementById('add-content').value.trim();
  if (!content) { toast('Content is required'); return; }
  try {
    await api('/api/memory/episodes', { method: 'POST', body: {
      content,
      kind: document.getElementById('add-kind').value,
      mode: document.getElementById('add-mode').value.trim(),
      chat_id: document.getElementById('add-session').value.trim() || 'manual',
    }});
    document.getElementById('add-content').value = '';
    toast('Added');
    await Promise.all([load(0), loadSnapshot(), loadStats()]);
  } catch (e) { toast('Add failed: ' + e.message); }
}

// ---------------------------------------------------------------- scenarios

async function loadScenarios() {
  const el = document.getElementById('scenario-list');
  try {
    const data = await api('/api/memory/scenarios');
    if (!data.scenarios.length) {
      el.innerHTML = '<div class="empty-note">No saved scenarios yet. Stage the memory log above, then save it here.</div>';
      return;
    }
    el.innerHTML = `<table><thead><tr>
      <th>Name</th><th>Description</th><th>Entries</th><th>Saved</th><th></th>
    </tr></thead><tbody>
    ${data.scenarios.map(s => `<tr>
      <td><strong>${esc(s.name)}</strong></td>
      <td style="color:var(--text-muted)">${esc(s.description) || '—'}</td>
      <td>${s.episodes}</td>
      <td class="col-when">${esc((s.saved_at || '').replace('T', ' '))}</td>
      <td class="col-actions">
        <button class="btn" onclick='loadScenario(${JSON.stringify(s.slug)}, ${JSON.stringify(s.name)})'>▶ Load</button>
        <button class="btn danger" onclick='deleteScenario(${JSON.stringify(s.slug)}, ${JSON.stringify(s.name)})'>Delete</button>
      </td>
    </tr>`).join('')}</tbody></table>`;
  } catch (e) {
    el.innerHTML = `<div class="empty-note">${esc(e.message)}</div>`;
  }
}

async function saveScenario() {
  const name = document.getElementById('sc-name').value.trim();
  if (!name) { toast('Scenario name is required'); return; }
  try {
    await api('/api/memory/scenarios', { method: 'POST', body: {
      name, description: document.getElementById('sc-desc').value.trim(),
    }});
    document.getElementById('sc-name').value = '';
    document.getElementById('sc-desc').value = '';
    toast('Scenario saved');
    loadScenarios();
  } catch (e) { toast('Save failed: ' + e.message); }
}

async function loadScenario(slug, name) {
  if (!confirm(`Load scenario "${name}"?\n\nThis REPLACES the entire current memory log. Save the current state as a scenario first if you want to keep it.`)) return;
  const body = {};
  if (document.getElementById('sc-retime').checked) {
    body.retime_newest_days_ago = parseFloat(document.getElementById('sc-days').value) || 0;
  }
  try {
    const data = await api(`/api/memory/scenarios/${slug}/load`, { method: 'POST', body });
    toast(`Loaded "${data.name}" (${data.loaded} entries)`);
    await Promise.all([load(0), loadSnapshot(), loadStats()]);
  } catch (e) { toast('Load failed: ' + e.message); }
}

async function deleteScenario(slug, name) {
  if (!confirm(`Delete scenario "${name}"? The saved file is removed; current memory is untouched.`)) return;
  try {
    await api('/api/memory/scenarios/' + slug, { method: 'DELETE' });
    toast('Scenario deleted');
    loadScenarios();
  } catch (e) { toast('Delete failed: ' + e.message); }
}

document.getElementById('f-query').addEventListener('keydown', e => {
  if (e.key === 'Enter') load(0);
});

loadStats();
loadSnapshot();
load(0);
loadScenarios();
</script>
</body>
</html>
