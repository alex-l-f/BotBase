<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>BotBase — Sign in</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text-muted: #666;
    --accent: #0066cc;
    --error: #b3261e;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  #login-card {
    width: 100%;
    max-width: 380px;
    padding: 32px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  h1 { font-size: 20px; font-weight: 600; }

  p.lead {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  input[type="password"] {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }

  input[type="password"]:focus { border-color: var(--accent); }

  button {
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }

  button:disabled { opacity: 0.5; cursor: default; }
  button:hover:not(:disabled) { filter: brightness(1.1); }

  #error-msg {
    font-size: 13px;
    color: var(--error);
    display: none;
  }

  #error-msg.visible { display: block; }
</style>
</head>
<body>

<form id="login-card">
  <h1>BotBase</h1>
  <p class="lead">This is a private demo. Enter the access password to continue.</p>
  <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" autofocus>
  <div id="error-msg">Incorrect password — please try again.</div>
  <button type="submit" id="login-btn">Enter</button>
</form>

<script>
// Same mount-point trick as the chat page so this works behind a
// path-prefixed reverse proxy.
const API = window.location.origin + window.location.pathname.replace(/\/+$/, '');
const form = document.getElementById('login-card');
const passwordInput = document.getElementById('password-input');
const loginBtn = document.getElementById('login-btn');
const errorMsg = document.getElementById('error-msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = passwordInput.value;
  if (!password) return;

  loginBtn.disabled = true;
  errorMsg.classList.remove('visible');
  try {
    const resp = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    if (resp.ok) {
      window.location.reload();
      return;
    }
    errorMsg.classList.add('visible');
    passwordInput.select();
  } catch (err) {
    errorMsg.textContent = 'Could not reach the server.';
    errorMsg.classList.add('visible');
  }
  loginBtn.disabled = false;
});
</script>
</body>
</html>
